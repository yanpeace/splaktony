<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1c2c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Splak Tony" />
    <meta name="application-name" content="Splak Tony" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Splak Tony</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #1a1c2c;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game { width: 100%; height: 100%; }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: none;
      }
      /* scanline CRT leggero: stessa area del canvas (Scale.FIT 180x320 = 9:16,
         centrato), una riga scura ogni pixel logico. Non intercetta i tocchi. */
      #crt {
        display: none;
        position: fixed;
        left: 50%;
        top: 50%;
        width: min(100vw, calc(100vh * 9 / 16));
        height: min(100vh, calc(100vw * 16 / 9));
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 2;
        background-image: repeating-linear-gradient(
          to bottom,
          rgba(26, 28, 44, 0) 0,
          rgba(26, 28, 44, 0) 50%,
          rgba(26, 28, 44, 0.22) 50%,
          rgba(26, 28, 44, 0.22) 100%
        );
        background-size: 100% calc(100% / 320);
      }
      body.crt #crt { display: block; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="crt" aria-hidden="true"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
