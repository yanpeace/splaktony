<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1c2c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Splak Tony" />
    <meta name="application-name" content="Splak Tony" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Splak Tony</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #1a1c2c;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* il riquadro del gioco è FISSO su tutta la finestra visibile (anche sotto
         barra di stato e indicatore home, con viewport-fit=cover): su iOS
         height:100% di html/body resta all'altezza "piccola" (barre di Safari
         visibili) e lasciava una banda in basso. config/screen.ts misura
         proprio questo riquadro per l'altezza logica. */
      #game {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        overflow: hidden;
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: none;
      }
      /* scanline CRT leggero: una riga scura ogni pixel logico. Posizione,
         misura e passo delle righe li copia main.ts dal canvas (l'altezza
         logica dipende dallo schermo). Non intercetta i tocchi. */
      #crt {
        display: none;
        position: fixed;
        left: 0;
        top: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: 2;
        background-image: repeating-linear-gradient(
          to bottom,
          rgba(26, 28, 44, 0) 0,
          rgba(26, 28, 44, 0) 50%,
          rgba(26, 28, 44, 0.22) 50%,
          rgba(26, 28, 44, 0.22) 100%
        );
        background-size: 100% 2px;
      }
      body.crt #crt { display: block; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="crt" aria-hidden="true"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
